name: Release artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  dist:
    name: Build and test distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Resolve version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$RELEASE_TAG"
          if [[ -z "$version" ]]; then
            version=$(git describe --tags --exact-match 2>/dev/null || printf 'dev-%s' "$(git rev-parse --short HEAD)")
          fi
          if [[ ! "$version" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]]; then
            printf 'invalid version: %s\n' "$version" >&2
            exit 1
          fi
          printf 'VERSION=%s\n' "$version" >> "$GITHUB_ENV"
      - run: go test -count=1 ./...
      - name: Build distribution matrix
        run: make dist
      - name: Verify checksums and Linux archive
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          smoke_dir=$(mktemp -d)
          trap 'rm -rf "$smoke_dir"' EXIT
          name="portugo-$VERSION-linux-amd64"
          tar -xzf "dist/$name.tar.gz" -C "$smoke_dir"
          test "$("$smoke_dir/$name/portugo" --version)" = "$VERSION"
          "$smoke_dir/$name/portugo" run examples/hello.alg > "$smoke_dir/hello.out"
          printf 'Ola, Portugol!\n' > "$smoke_dir/hello.want"
          cmp "$smoke_dir/hello.want" "$smoke_dir/hello.out"
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: portugo-dist
          path: |
            dist/portugo-*.tar.gz
            dist/portugo-*.zip
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    name: Attach artifacts to GitHub Release
    needs: dist
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: portugo-dist
          path: dist
      - name: Attach archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/portugo-*.tar.gz \
            dist/portugo-*.zip \
            dist/SHA256SUMS \
            --clobber
