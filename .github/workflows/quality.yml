name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: false
      - name: Install pinned linters
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.6.1
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.4.0
      - run: go build ./...
      - run: go run ./scripts/checkfmt
      - run: go vet ./...
      - run: staticcheck ./...
      - run: golangci-lint run
      - run: go test -race -count=1 ./...
      - name: Module hygiene
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.22.12', '1.25.0']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: go build ./...
      - run: go test -count=1 ./...

  fuzz-lexer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: false
      - run: go test ./internal/lexer -run=TestFuzz -fuzz=FuzzLexer -fuzztime=30s -timeout=2m -parallel=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: lexer-fuzz-regressions
          path: internal/lexer/testdata/fuzz
          if-no-files-found: ignore

  fuzz-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: false
      - run: go test ./internal/parser -run=TestFuzz -fuzz=FuzzParser -fuzztime=30s -timeout=2m -parallel=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: parser-fuzz-regressions
          path: internal/parser/testdata/fuzz
          if-no-files-found: ignore

  specifications:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @fission-ai/openspec@1.8.0
      - run: openspec validate --all --strict --no-interactive
      - run: bash scripts/check-oracle.sh
